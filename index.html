<style>
  :root {
    color-scheme: light only;
    --paper: #efece4;
    --ink: #111;
    --red: #e8331c;
    --blue: #1f48c8;
    --font: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
    --st: env(safe-area-inset-top, 0px);
    --sb: env(safe-area-inset-bottom, 0px);
    --sl: env(safe-area-inset-left, 0px);
    --sr: env(safe-area-inset-right, 0px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; background: var(--paper); }
  body {
    position: fixed; inset: 0;
    color: var(--ink);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    touch-action: manipulation;
  }

  .poster {
    position: fixed; left: 0; right: 0; top: 0;
    height: 100vh; height: 100dvh;
    max-width: 430px;
    margin: 0 auto;
    padding: calc(var(--st) + 20px) calc(var(--sr) + 22px) calc(var(--sb) + 20px) calc(var(--sl) + 22px);
    display: flex; flex-direction: column;
    overflow: hidden;
  }

  .label { font-size: 12px; font-weight: 500; line-height: 1.3; display: flex; justify-content: space-between; border-top: 2px solid var(--ink); padding-top: 7px; }

  .scene {
    flex: 1 1 auto; min-height: 0;
    width: 100%;
    margin: 6px 0 14px;
    display: block;
    pointer-events: none;
    overflow: visible;
  }

  h1 {
    font-weight: 700;
    font-size: clamp(50px, 16.4vw, 70px);
    line-height: .88;
    letter-spacing: -.045em;
    margin-left: -.04em;
  }
  h1 span { display: block; }
  h1 .r { color: var(--red); }

  .row { margin-top: 24px; display: flex; align-items: center; gap: 20px; min-height: 104px; }

  button {
    font-family: inherit; border: 0; cursor: pointer;
    touch-action: manipulation;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-appearance: none; appearance: none;
  }
  #yes {
    width: 104px; height: 104px; border-radius: 50%;
    background: var(--red); color: var(--paper);
    font-size: 30px; font-weight: 700; letter-spacing: -.04em;
    transition: transform .5s cubic-bezier(.3,1.6,.5,1);
    transform-origin: left center;
  }
  #yes:active { transform: scale(.94); }
  #yes.big { transform: scale(1.18); }
  #yes.big:active { transform: scale(1.1); }
  #no {
    min-width: 96px; height: 52px; padding: 0 18px; white-space: nowrap;
    background: var(--ink); color: var(--paper);
    font-size: 22px; font-weight: 700; letter-spacing: -.04em;
  }
  #no.loose {
    position: fixed; z-index: 20; margin: 0;
    transition: left .2s cubic-bezier(.2,.9,.2,1), top .2s cubic-bezier(.2,.9,.2,1), transform .45s cubic-bezier(.6,0,.8,.3), opacity .45s;
  }
  #no.gone { transform: scale(0) rotate(-12deg); opacity: 0; pointer-events: none; }

  .sign { margin-top: 18px; display: flex; justify-content: space-between; align-items: end; }
  .sign b { font-size: 15px; font-weight: 700; letter-spacing: -.02em; }
  .cross { width: 16px; height: 16px; display: block; }

  /* after yes */
  #done { display: none; }
  .yes #ask { display: none; }
  .yes #done { display: block; }
  .big {
    font-weight: 800;
    font-size: clamp(104px, 33vw, 142px);
    line-height: .8;
    letter-spacing: -.075em;
    color: var(--red);
    margin-left: -.06em;
    white-space: nowrap;
  }
  .line2 { font-weight: 700; font-size: clamp(40px, 12.4vw, 54px); line-height: .9; letter-spacing: -.035em; margin-top: 10px; }
  .cal { margin-top: 20px; display: flex; align-items: center; gap: 18px; }
  .cal a { color: var(--ink); text-decoration: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  #addcal {
    height: 54px; padding: 0 18px; display: inline-flex; align-items: center; gap: 12px; white-space: nowrap; flex: none;
    background: var(--ink); color: var(--paper); font-size: 17px; font-weight: 700; letter-spacing: -.03em;
  }
  #addcal svg { width: 26px; height: 14px; }
  #gcal { white-space: nowrap; font-size: 13px; font-weight: 500; min-height: 44px; display: inline-flex; align-items: center; text-decoration: underline; text-underline-offset: 3px; }

  .enter { animation: enter .55s cubic-bezier(.2,.8,.2,1) backwards; }
  .d2 { animation-delay: .1s; }
  .d3 { animation-delay: .2s; }
  @keyframes enter { from { opacity: 0; transform: translateY(18px); } }
  .yes #done .enter { animation-name: enter; }

  @media (prefers-reduced-motion: reduce) { #no.loose { transition: none; } }
</style>

<script>
/* ---------- the scene: two silhouettes, joints driven by keyframes + 2-bone IK ---------- */
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var D = Math.PI / 180;

  function ease(kind, p) {
    if (kind === 'lin') return p;
    if (kind === 'in') return p * p * p;
    if (kind === 'out') return 1 - Math.pow(1 - p, 3);
    if (kind === 'back') { var c = 1.7; p = p - 1; return 1 + (c + 1) * p * p * p + c * p * p; }
    return p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
  }
  function sample(track, t) {
    if (t <= track[0][0]) return track[0][1];
    for (var i = 1; i < track.length; i++) {
      var b = track[i];
      if (t <= b[0]) {
        var a = track[i - 1], p = ease(b[2], (t - a[0]) / (b[0] - a[0]));
        if (typeof a[1] === 'number') return a[1] + (b[1] - a[1]) * p;
        return [a[1][0] + (b[1][0] - a[1][0]) * p, a[1][1] + (b[1][1] - a[1][1]) * p];
      }
    }
    return track[track.length - 1][1];
  }

  // rest poses (each figure in its own hip frame, facing +x)
  var M_REST = [25, -14];     // his wrist on his thigh
  var W_BACK = [-5, -8];      // her back hand on the stool behind her
  var W_FRONT = [39, -48];    // her hand on her glass
  var M_GRAB = [64, -49];     // his wrist over her far shoulder
  var M_UP = [54, -80];       // his wrist after she lifts it

  // the loop: 1 hand, 2 yawn-arm, 3 lean. 9.6 s
  var LOOP = 9600;
  var T = {
    mT: [[0,0],[3200,0],[3650,-5],[4400,8],[5300,8],[5800,0],[6500,0],[7400,13,'io'],[7850,13],[8050,5,'out'],[8250,4],[8700,-2],[9200,0]],
    mH: [[0,0],[3200,0],[3650,-16],[4150,-8],[4450,0],[6500,0],[7400,7],[7850,7],[8050,-14,'out'],[8300,-12],[8800,-4],[9200,0]],
    mHand: [[0,M_REST],[500,M_REST],[1750,[47,-13],'io'],[1880,[47,-13]],[2020,[47,-9],'in'],[2350,M_REST,'out'],
            [3200,M_REST],[3800,[2,-102]],[4450,M_GRAB],[5000,M_GRAB],[5300,M_UP],[5480,M_UP],[5760,M_REST,'in'],[9600,M_REST]],
    wBack: [[0,W_BACK],[1780,W_BACK],[1900,[-9,-34],'out'],[2020,[-15,-15],'in'],[2250,[-12,-26],'out'],[2650,W_BACK],
            [4700,W_BACK],[5000,[1,-52]],[5300,[-8,-80]],[5480,[-8,-80]],[5700,[-6,-58],'out'],[6050,W_BACK],
            [7350,W_BACK],[7750,[-28,-66]],[7860,[-29,-66]],[8050,[-46,-71],'out'],[8300,[-45,-70]],[8450,[-30,-60]],[8850,W_BACK]],
    wFront: [[0,W_FRONT],[9600,W_FRONT]],
    wT: [[0,0],[7900,0],[8050,3],[8600,0]],
    wH: [[0,0],[1850,0],[1950,-9,'out'],[2500,0],[4950,0],[5100,-6],[5800,0],[7700,0],[7850,-8,'out'],[8400,-8],[8800,0]],
    flip: [[0,1],[9600,1]]
  };

  var els = { mT: $('mT'), mH: $('mH'), wT: $('wT'), wH: $('wH'), wA: $('wFlipA'), wB: $('wFlipB'), heart: $('heart'),
    mU: $('mArmU'), mF: $('mArmF'), wbU: $('wBackU'), wbF: $('wBackF'), wfU: $('wFrontU'), wfF: $('wFrontF') };
  var elbows = { m: [-2, -21], wb: [-6, -28], wf: [18, -30] };

  function rot(p, deg) { var c = Math.cos(deg * D), s = Math.sin(deg * D); return [p[0] * c - p[1] * s, p[0] * s + p[1] * c]; }

  function arm(key, gU, gF, S, Tg, L1, L2) {
    var dx = Tg[0] - S[0], dy = Tg[1] - S[1];
    var d = Math.max(Math.abs(L1 - L2) + .5, Math.min(L1 + L2 - .01, Math.hypot(dx, dy)));
    var a = Math.atan2(dy, dx);
    var al = Math.acos(Math.max(-1, Math.min(1, (L1 * L1 + d * d - L2 * L2) / (2 * L1 * d))));
    var best = null, bd = 1e9;
    [a + al, a - al].forEach(function (u) {
      var e = [S[0] + L1 * Math.cos(u), S[1] + L1 * Math.sin(u)];
      var dd = Math.hypot(e[0] - elbows[key][0], e[1] - elbows[key][1]);
      if (dd < bd) { bd = dd; best = { u: u, e: e }; }
    });
    elbows[key] = best.e;
    var f = Math.atan2(Tg[1] - best.e[1], Tg[0] - best.e[0]);
    gU.setAttribute('transform', 'translate(' + S[0].toFixed(2) + ',' + S[1].toFixed(2) + ') rotate(' + (best.u / D - 90).toFixed(2) + ')');
    gF.setAttribute('transform', 'translate(0,' + L1 + ') rotate(' + ((f - best.u) / D).toFixed(2) + ')');
  }

  function pose(p) {
    els.mT.setAttribute('transform', 'rotate(' + p.mT.toFixed(2) + ')');
    els.mH.setAttribute('transform', 'translate(0,-56) rotate(' + p.mH.toFixed(2) + ')');
    els.wT.setAttribute('transform', 'rotate(' + p.wT.toFixed(2) + ')');
    els.wH.setAttribute('transform', 'translate(2,-55) rotate(' + p.wH.toFixed(2) + ')');
    var fx = Math.abs(p.flip) < .02 ? .02 * (p.flip < 0 ? -1 : 1) : p.flip;
    els.wA.setAttribute('transform', 'translate(212,166) scale(' + fx.toFixed(3) + ',1)');
    els.wB.setAttribute('transform', 'translate(212,166) scale(' + fx.toFixed(3) + ',1)');
    arm('m', els.mU, els.mF, rot([1, -50], p.mT), p.mHand, 30, 28);
    var ws = rot([1, -48], p.wT);
    arm('wb', els.wbU, els.wbF, ws, p.wBack, 25, 23);
    arm('wf', els.wfU, els.wfF, ws, p.wFront, 25, 23);
    var h = p.heart || 0;
    els.heart.setAttribute('transform', 'translate(181,' + (64 - 6 * h).toFixed(2) + ') scale(' + h.toFixed(3) + ')');
  }

  function at(tracks, t) { var o = {}; for (var k in tracks) o[k] = sample(tracks[k], t); return o; }

  // the kiss: settle, she turns to him, both lean in, then a slow sway
  var KISS_IN = 2000;
  function kissTracks(p0) {
    return {
      mT: [[0,p0.mT],[500,0],[1100,0],[1900,17.5,'io']],
      mH: [[0,p0.mH],[500,0],[1100,0],[1900,9,'io']],
      mHand: [[0,p0.mHand],[500,M_REST],[1100,M_REST],[1900,[64,-14]]],
      wBack: [[0,p0.wBack],[500,W_BACK],[2000,[22,-12]]],
      wFront: [[0,p0.wFront],[600,W_FRONT],[1100,[30,-40]],[1900,[43,-60],'io']],
      wT: [[0,p0.wT],[500,0],[1100,0],[1900,17.5,'io']],
      wH: [[0,p0.wH],[500,0],[1100,0],[1900,9,'io']],
      flip: [[0,1],[600,1],[1050,-1,'io']],
      heart: [[0,0],[1800,0],[2150,1.2,'out'],[2400,1]]
    };
  }

  var mode = 'loop', t0 = performance.now(), kiss = null, frozen = null;
  function frame(now) {
    var t = now - t0, p;
    if (frozen !== null) t = frozen;
    if (mode === 'loop') {
      p = at(T, t % LOOP);
    } else {
      p = at(kiss, Math.min(t, KISS_IN + 400));
      if (t > KISS_IN) { // gentle sway, in step so the lips stay together
        var s = Math.sin((t - KISS_IN) / 1600 * Math.PI) * 1.4;
        p.mT += s; p.wT -= s; p.mH += s * .4; p.wH -= s * .4;
        p.heart = 1 + .12 * Math.sin((t - KISS_IN) / 420 * Math.PI);
      }
    }
    pose(p);
    if (frozen === null) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  window.scene = {
    kiss: function () {
      var now = performance.now();
      var cur = mode === 'loop' ? at(T, (now - t0) % LOOP) : null;
      cur.heart = 0;
      kiss = kissTracks(cur); mode = 'kiss'; t0 = now;
    },
    // for tests: render one frozen moment
    freeze: function (m, t) { if (m === 'kiss' && mode !== 'kiss') window.scene.kiss(); mode = m; frozen = t; frame(performance.now()); },
    lips: function () {
      var a = $('mLips').getBoundingClientRect(), b = $('wLips').getBoundingClientRect();
      return [a.left - b.left, a.top - b.top];
    }
  };
})();

/* ---------- the question ---------- */
(function () {
  var yes = document.getElementById('yes');
  var no = document.getElementById('no');
  var scene = document.getElementById('scene');
  var GAP = 16, PAD = 12;
  var tries = 0;
  var LINES = ['are you sure?', 'really?', 'last chance.', 'ok then.'];

  var probe = document.createElement('div');
  probe.style.cssText = 'position:fixed;visibility:hidden;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)';
  document.body.appendChild(probe);
  function insets() {
    var s = getComputedStyle(probe);
    return { t: parseFloat(s.paddingTop) || 0, r: parseFloat(s.paddingRight) || 0, b: parseFloat(s.paddingBottom) || 0, l: parseFloat(s.paddingLeft) || 0 };
  }

  var last = 0;
  function attempt(e) {
    if (e && e.cancelable) e.preventDefault();
    if (e) e.stopPropagation();
    if (tries >= 4 + LINES.length) return;
    var now = Date.now();
    if (now - last < 200) return; // one tap fires several events: count it once
    last = now;
    tries++;
    if (tries >= 5) no.textContent = LINES[Math.min(tries - 5, LINES.length - 1)];
    dodge();
    if (tries >= 4 + LINES.length) {
      setTimeout(function () { no.classList.add('gone'); yes.classList.add('big'); }, 650);
      setTimeout(function () { no.remove(); }, 1200);
    }
  }

  function dodge() {
    var r = no.getBoundingClientRect();
    if (!no.classList.contains('loose')) {
      no.style.left = r.left + 'px'; no.style.top = r.top + 'px';
      document.body.appendChild(no);
      no.classList.add('loose');
      void no.offsetWidth;
    }
    var nr = no.getBoundingClientRect();
    var w = nr.width, h = nr.height, s = insets();
    var vw = document.documentElement.clientWidth, vh = window.innerHeight;
    var minX = s.l + PAD, maxX = vw - s.r - PAD - w;
    var minY = s.t + PAD, maxY = vh - s.b - PAD - h;
    var yr = yes.getBoundingClientRect();
    var x, y, found = false;
    for (var i = 0; i < 80 && !found; i++) {
      x = minX + Math.random() * (maxX - minX);
      y = minY + Math.random() * (maxY - minY);
      var clear = x + w + GAP < yr.left || x - GAP > yr.right || y + h + GAP < yr.top || y - GAP > yr.bottom;
      var far = Math.abs(x - r.left) + Math.abs(y - r.top) > 110;
      found = clear && far;
    }
    if (!found) { x = yr.left > vw / 2 ? minX : maxX; y = yr.top > vh / 2 ? minY : maxY; }
    no.style.left = Math.round(x) + 'px';
    no.style.top = Math.round(y) + 'px';
  }

  no.addEventListener('touchstart', attempt, { passive: false });
  no.addEventListener('pointerdown', attempt, { passive: false });
  no.addEventListener('mousedown', attempt);
  no.addEventListener('mouseenter', function () { attempt(null); });
  no.addEventListener('click', function (e) { e.preventDefault(); e.stopPropagation(); }); // backstop: No never does anything

  window.addEventListener('resize', function () {
    if (!no.parentNode || !no.classList.contains('loose')) return;
    var r = no.getBoundingClientRect(), s = insets();
    if (r.left < s.l || r.top < s.t || r.right > document.documentElement.clientWidth - s.r || r.bottom > innerHeight - s.b) dodge();
  });

  // calendar: tonight 20:00 to 23:00, floating local time (the device's own zone)
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function stamp(d) { return d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()); }
  function utc(d) { return d.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, ''); }
  var day = stamp(new Date());
  var START = day + 'T200000', END = day + 'T230000';
  window.buildICS = function () {
    return [
      'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Dov//Marija and Dov//EN', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH',
      'BEGIN:VEVENT',
      'UID:date-with-dov-' + day + '@dov-deveng.github.io',
      'DTSTAMP:' + utc(new Date()),
      'DTSTART:' + START, 'DTEND:' + END,
      'SUMMARY:Date with Dov',
      'DESCRIPTION:8:00. It\'s a date.',
      'BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:Date with Dov', 'TRIGGER:-PT1H', 'END:VALARM',
      'END:VEVENT', 'END:VCALENDAR', ''
    ].join('\r\n');
  };
  document.getElementById('gcal').href = 'https://calendar.google.com/calendar/render?action=TEMPLATE&text=' +
    encodeURIComponent('Date with Dov') + '&dates=' + START + '/' + END + '&details=' + encodeURIComponent("8:00. It's a date.");

  // iOS: a real .ics served as text/calendar is what Safari (and iMessage's Safari view) hands to Calendar.
  // tonight.ics on this site is for STATIC_DAY; on any other day, build one on the fly.
  var STATIC_DAY = '20261104';
  var ios = /iP(hone|od|ad)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  document.getElementById('addcal').addEventListener('click', function (e) {
    if (ios && day === STATIC_DAY) return;
    e.preventDefault();
    var ics = window.buildICS();
    if (ios) { location.href = 'data:text/calendar;charset=utf-8,' + encodeURIComponent(ics); return; }
    var url = URL.createObjectURL(new Blob([ics], { type: 'text/calendar;charset=utf-8' }));
    var a = document.createElement('a'); a.href = url; a.download = 'date-with-dov.ics';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  });

  document.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });

  yes.addEventListener('click', function () {
    if (no.parentNode) no.remove();
    // keep the couple exactly where they are while the text swaps
    var h = scene.getBoundingClientRect().height;
    scene.style.flex = '0 0 ' + h + 'px';
    document.getElementById('poster').classList.add('yes');
    document.getElementById('done').style.marginTop = 'auto';
    scene.style.marginTop = 'auto';
    window.scene.kiss();
  });
})();
</script>
</body>
