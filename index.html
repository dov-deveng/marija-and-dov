<style>
  :root {
    color-scheme: light only;
    --paper: #efece4;
    --ink: #111;
    --red: #e8331c;
    --blue: #1f48c8;
    --font: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
    --st: env(safe-area-inset-top, 0px);
    --sb: env(safe-area-inset-bottom, 0px);
    --sl: env(safe-area-inset-left, 0px);
    --sr: env(safe-area-inset-right, 0px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    background: var(--paper);
  }
  body {
    position: fixed; inset: 0;
    color: var(--ink);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    touch-action: manipulation;
  }

  .screen {
    position: fixed; left: 0; right: 0; top: 0;
    height: 100vh; height: 100dvh;
    display: none;
    overflow: hidden;
  }
  .screen.active { display: block; }

  .poster {
    position: relative; z-index: 2;
    height: 100%;
    max-width: 430px;
    margin: 0 auto;
    padding: calc(var(--st) + 22px) calc(var(--sr) + 22px) calc(var(--sb) + 22px) calc(var(--sl) + 22px);
    display: flex; flex-direction: column;
  }

  .label { font-size: 12px; font-weight: 500; line-height: 1.3; }

  h1 {
    margin-top: auto;
    font-weight: 700;
    font-size: clamp(56px, 18.6vw, 80px);
    line-height: .88;
    letter-spacing: -.045em;
    margin-left: -.04em;
  }
  h1 span { display: block; }
  h1 .r { color: var(--red); }

  .row { margin-top: 32px; display: flex; align-items: center; gap: 20px; min-height: 112px; }

  button {
    font-family: inherit; border: 0; cursor: pointer;
    touch-action: manipulation;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-appearance: none; appearance: none;
  }
  #yes {
    width: 112px; height: 112px; border-radius: 50%;
    background: var(--red); color: var(--paper);
    font-size: 32px; font-weight: 700; letter-spacing: -.04em;
    transition: transform .2s cubic-bezier(.3,1.6,.5,1);
  }
  #yes:active { transform: scale(.94); }
  #no {
    width: 100px; height: 54px;
    background: var(--ink); color: var(--paper);
    font-size: 23px; font-weight: 700; letter-spacing: -.04em;
  }
  #no.loose {
    position: fixed; z-index: 20; margin: 0;
    transition: left .2s cubic-bezier(.2,.9,.2,1), top .2s cubic-bezier(.2,.9,.2,1);
  }

  .sign { margin-top: 40px; display: flex; justify-content: space-between; align-items: end; }
  .sign b { font-size: 15px; font-weight: 700; letter-spacing: -.02em; }
  .cross { width: 16px; height: 16px; display: block; }

  .ring { position: absolute; z-index: 1; pointer-events: none; top: calc(var(--st) - 110px); right: -130px; width: 330px; height: 330px; }

  /* end screen */
  .end h1 { margin-top: 0; }
  .big {
    margin-top: auto;
    font-weight: 800;
    font-size: clamp(116px, 38vw, 164px);
    line-height: .8;
    letter-spacing: -.075em;
    color: var(--red);
    margin-left: -.06em;
    white-space: nowrap;
  }
  .line2 { font-weight: 700; font-size: clamp(42px, 13.4vw, 58px); line-height: .9; letter-spacing: -.035em; margin-top: 12px; }
  .scene { width: 100%; height: auto; display: block; margin-top: 28px; }

  .lean-l { transform-origin: 128px 214px; animation: leanL 4.2s cubic-bezier(.6,0,.3,1) infinite; }
  .lean-r { transform-origin: 192px 214px; animation: leanR 4.2s cubic-bezier(.6,0,.3,1) infinite; }
  @keyframes leanL { 0%, 18% { transform: rotate(0); } 42%, 74% { transform: rotate(8.5deg); } 96%, 100% { transform: rotate(0); } }
  @keyframes leanR { 0%, 18% { transform: rotate(0); } 42%, 74% { transform: rotate(-8.5deg); } 96%, 100% { transform: rotate(0); } }
  .spark { transform-origin: 160px 54px; animation: spark 4.2s ease-out infinite; opacity: 0; }
  @keyframes spark {
    0%, 42% { opacity: 0; transform: scale(.2) rotate(0); }
    50% { opacity: 1; transform: scale(1.15) rotate(45deg); }
    58%, 70% { opacity: 1; transform: scale(1) rotate(45deg); }
    78%, 100% { opacity: 0; transform: scale(.6) rotate(45deg); }
  }

  .screen.active .enter { animation: enter .55s cubic-bezier(.2,.8,.2,1) backwards; }
  .screen.active .d2 { animation-delay: .1s; }
  .screen.active .d3 { animation-delay: .2s; }
  @keyframes enter { from { opacity: 0; transform: translateY(20px); } }

  @media (prefers-reduced-motion: reduce) {
    .lean-l, .lean-r, .spark { animation-duration: 8s; }
    #no.loose { transition: none; }
  }
</style>
</head>
<body>

<section class="screen active" id="s-ask">
  <svg class="ring" viewBox="0 0 400 400" aria-hidden="true">
    <circle cx="200" cy="200" r="178" fill="none" stroke="#1f48c8" stroke-width="40"/>
    <circle cx="200" cy="200" r="62" fill="#e8331c"/>
  </svg>
  <div class="poster">
    <div class="label">For Marija</div>
    <h1 class="enter"><span>are we</span><span>going out</span><span class="r">tonight</span><span>at 8:00?</span></h1>
    <div class="row enter d2">
      <button id="yes" type="button">yes</button>
      <button id="no" type="button" tabindex="-1">no</button>
    </div>
    <div class="sign enter d3">
      <b>Dov</b>
      <svg class="cross" viewBox="0 0 18 18" aria-hidden="true"><path d="M6 0h6v6h6v6h-6v6H6v-6H0V6h6z" fill="#e8331c"/></svg>
    </div>
  </div>
</section>

<section class="screen end" id="s-yes">
  <div class="poster">
    <div class="big enter">8:00.</div>
    <div class="line2 enter d2">it's a date.</div>
    <svg class="scene enter d3" viewBox="0 0 320 270" role="img" aria-label="Two figures at a bar leaning in for a kiss">
      <rect x="0" y="168" width="320" height="10" fill="#111"/>
      <g transform="translate(34 128)">
        <path d="M0 0h34L17 20z" fill="none" stroke="#111" stroke-width="3" stroke-linejoin="round"/>
        <rect x="15.5" y="20" width="3" height="16" fill="#111"/>
        <rect x="8" y="36" width="18" height="4" fill="#111"/>
        <line x1="12" y1="-10" x2="20" y2="9" stroke="#111" stroke-width="2"/><circle cx="19" cy="7" r="4.5" fill="#e8331c"/>
      </g>
      <g fill="#111">
        <rect x="104" y="212" width="48" height="7"/><rect x="125" y="219" width="6" height="44"/><rect x="112" y="261" width="32" height="5"/>
        <rect x="168" y="212" width="48" height="7"/><rect x="189" y="219" width="6" height="44"/><rect x="176" y="261" width="32" height="5"/>
      </g>
      <g class="lean-l">
        <rect x="110" y="128" width="36" height="84" fill="#e8331c"/>
        <circle cx="128" cy="98" r="22" fill="#e8331c" style="mix-blend-mode:multiply"/>
      </g>
      <g class="lean-r">
        <rect x="174" y="128" width="36" height="84" fill="#1f48c8"/>
        <circle cx="192" cy="98" r="22" fill="#1f48c8" style="mix-blend-mode:multiply"/>
      </g>
      <g class="spark"><path d="M155 39h10v10h10v10h-10v10h-10V59h-10V49h10z" fill="#e8331c"/></g>
    </svg>
    <div class="sign"><b>Dov</b><svg class="cross" viewBox="0 0 18 18" aria-hidden="true"><path d="M6 0h6v6h6v6h-6v6H6v-6H0V6h6z" fill="#e8331c"/></svg></div>
  </div>
</section>

<script>
(function () {
  var yes = document.getElementById('yes');
  var no = document.getElementById('no');
  var GAP = 16, PAD = 12;

  // read the safe-area insets once from CSS
  var probe = document.createElement('div');
  probe.style.cssText = 'position:fixed;visibility:hidden;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)';
  document.body.appendChild(probe);
  function insets() {
    var s = getComputedStyle(probe);
    return { t: parseFloat(s.paddingTop) || 0, r: parseFloat(s.paddingRight) || 0, b: parseFloat(s.paddingBottom) || 0, l: parseFloat(s.paddingLeft) || 0 };
  }

  function dodge(e) {
    if (e && e.cancelable) e.preventDefault();
    if (e) e.stopPropagation();
    var r = no.getBoundingClientRect();
    if (!no.classList.contains('loose')) {
      no.style.left = r.left + 'px'; no.style.top = r.top + 'px';
      document.body.appendChild(no);
      no.classList.add('loose');
      void no.offsetWidth;
    }
    var w = r.width, h = r.height, s = insets();
    var vw = document.documentElement.clientWidth, vh = window.innerHeight;
    var minX = s.l + PAD, maxX = vw - s.r - PAD - w;
    var minY = s.t + PAD, maxY = vh - s.b - PAD - h;
    var yr = yes.getBoundingClientRect();
    var x, y, found = false;
    for (var i = 0; i < 80 && !found; i++) {
      x = minX + Math.random() * (maxX - minX);
      y = minY + Math.random() * (maxY - minY);
      var clear = x + w + GAP < yr.left || x - GAP > yr.right || y + h + GAP < yr.top || y - GAP > yr.bottom;
      var far = Math.abs(x - r.left) + Math.abs(y - r.top) > 110;
      found = clear && far;
    }
    if (!found) { x = yr.left > vw / 2 ? minX : maxX; y = yr.top > vh / 2 ? minY : maxY; }
    no.style.left = Math.round(x) + 'px';
    no.style.top = Math.round(y) + 'px';
  }

  no.addEventListener('touchstart', dodge, { passive: false });
  no.addEventListener('pointerdown', dodge, { passive: false });
  no.addEventListener('mousedown', dodge);
  no.addEventListener('mouseenter', function () { dodge(null); });
  no.addEventListener('click', dodge); // backstop: No never does anything

  window.addEventListener('resize', function () {
    if (!no.classList.contains('loose')) return;
    var r = no.getBoundingClientRect(), s = insets();
    if (r.left < s.l || r.top < s.t || r.right > document.documentElement.clientWidth - s.r || r.bottom > innerHeight - s.b) dodge(null);
  });

  // no page movement at all
  document.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });

  yes.addEventListener('click', function () {
    no.remove();
    document.getElementById('s-ask').classList.remove('active');
    document.getElementById('s-yes').classList.add('active');
  });
})();
</script>
</body>
