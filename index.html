<style>
  :root {
    --bg: #f4f0e8;
    --ink: #161513;
    --muted: #77726a;
    --line: #d9d3c7;
    --accent: #e0452b;
    --serif: "Instrument Serif", Georgia, "Times New Roman", serif;
    --sans: "Inter", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  main {
    position: relative;
    min-height: 100svh;
    max-width: 520px;
    margin: 0 auto;
    padding: max(28px, env(safe-area-inset-top)) 24px max(28px, env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
  }
  .top {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); display: inline-block; }

  .screen {
    flex: 1;
    display: none;
    flex-direction: column;
    justify-content: center;
    padding: 40px 0 24px;
  }
  .screen.active { display: flex; }
  .screen.active > * { animation: rise .7s cubic-bezier(.2,.7,.2,1) backwards; }
  .screen.active > *:nth-child(2) { animation-delay: .08s; }
  .screen.active > *:nth-child(3) { animation-delay: .16s; }
  .screen.active > *:nth-child(4) { animation-delay: .24s; }
  .screen.active > *:nth-child(5) { animation-delay: .32s; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  h1 {
    font-family: var(--serif);
    font-weight: 400;
    font-size: clamp(64px, 22vw, 104px);
    line-height: .95;
    letter-spacing: -.02em;
  }
  h2 {
    font-family: var(--serif);
    font-weight: 400;
    font-size: clamp(42px, 12.5vw, 64px);
    line-height: 1.02;
    letter-spacing: -.015em;
  }
  em { font-style: italic; color: var(--accent); }
  .lede {
    margin-top: 20px;
    font-size: 18px; line-height: 1.5; color: var(--muted); max-width: 30ch;
  }
  .sig { margin-top: 18px; font-family: var(--serif); font-style: italic; font-size: 22px; color: var(--muted); }

  .btn {
    appearance: none; border: 0; cursor: pointer;
    font: 600 17px/1 var(--sans);
    min-height: 54px; padding: 0 28px;
    border-radius: 999px;
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    transition: transform .25s cubic-bezier(.2,.7,.2,1), background .2s, box-shadow .2s;
    text-decoration: none;
    touch-action: manipulation;
    user-select: none; -webkit-user-select: none;
  }
  .btn:active { transform: scale(.97); }
  .btn-ink { background: var(--ink); color: var(--bg); }
  .btn-accent { background: var(--accent); color: #fff; box-shadow: 0 8px 24px -10px rgba(224,69,43,.6); }
  .btn-ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--ink); }
  .btn .arrow { transition: transform .25s; }
  .btn:hover .arrow { transform: translateX(3px); }

  .actions { margin-top: 40px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }

  /* the ask */
  .choices { margin-top: 44px; display: flex; flex-wrap: wrap; align-items: center; gap: 14px; min-height: 120px; position: relative; }
  #yes { min-width: 120px; transition: font-size .35s cubic-bezier(.3,1.5,.5,1), min-height .35s cubic-bezier(.3,1.5,.5,1), padding .35s cubic-bezier(.3,1.5,.5,1); }
  #no { min-width: 110px; }
  #no.loose {
    position: fixed; z-index: 5; margin: 0;
    transition: left .28s cubic-bezier(.2,.8,.2,1), top .28s cubic-bezier(.2,.8,.2,1);
  }
  #no.honest {
    position: static;
    background: transparent; border: 0;
    color: var(--muted);
    font-weight: 500; font-size: 15px;
    text-decoration: underline; text-underline-offset: 4px; text-decoration-color: var(--line);
    padding: 0 6px; min-height: 44px; min-width: 0;
  }
  .hint { margin-top: 22px; min-height: 22px; font-size: 14px; color: var(--muted); transition: opacity .3s; }

  .rule { width: 44px; height: 2px; background: var(--accent); margin-bottom: 26px; }

  canvas#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }

  footer { font-size: 12px; color: var(--muted); letter-spacing: .04em; }

  @media (prefers-reduced-motion: reduce) {
    .screen.active > * { animation: none; }
    #no.loose { transition: none; }
  }
</style>
</head>
<body>
<main>
  <div class="top"><span>For Marija</span><span class="dot" aria-hidden="true"></span></div>

  <!-- 1. opener -->
  <section class="screen active" id="s-intro" aria-live="polite">
    <h1>Marija,</h1>
    <p class="lede">I have one question for you. It's a yes or no question. Mostly.</p>
    <div class="actions">
      <button class="btn btn-ink" data-go="s-ask">Go on <span class="arrow" aria-hidden="true">&rarr;</span></button>
    </div>
  </section>

  <!-- 2. the ask -->
  <section class="screen" id="s-ask">
    <div class="rule"></div>
    <h2>Want to go on a date with me <em>tonight?</em></h2>
    <p class="sig">Dov</p>
    <div class="choices">
      <button class="btn btn-accent" id="yes">Yes</button>
      <button class="btn btn-ghost" id="no">No</button>
    </div>
    <p class="hint" id="hint">&nbsp;</p>
  </section>

  <!-- 3a. yes -->
  <section class="screen" id="s-yes">
    <div class="rule"></div>
    <h2>Good call.</h2>
    <p class="lede">I'll pick the place. You pick the time.</p>
    <p class="sig">Dov</p>
    <div class="actions">
      <a class="btn btn-accent" id="tell" href="sms:&amp;body=Yes.%20Tonight.">Tell Dov <span class="arrow" aria-hidden="true">&rarr;</span></a>
    </div>
  </section>

  <!-- 3b. rain check -->
  <section class="screen" id="s-rain">
    <div class="rule"></div>
    <h2>Fair.</h2>
    <p class="lede">Rain check accepted. The offer stands, no expiry date.</p>
    <p class="sig">Dov</p>
    <div class="actions">
      <button class="btn btn-ghost" id="changed">Actually, tonight works</button>
    </div>
  </section>

  <footer>One question. Two buttons.</footer>
</main>
<canvas id="confetti" aria-hidden="true"></canvas>

<script>
(function () {
  var screens = document.querySelectorAll('.screen');
  function show(id) {
    screens.forEach(function (s) { s.classList.toggle('active', s.id === id); });
    window.scrollTo(0, 0);
  }
  document.querySelectorAll('[data-go]').forEach(function (b) {
    b.addEventListener('click', function () { show(b.getAttribute('data-go')); });
  });

  var yes = document.getElementById('yes');
  var no = document.getElementById('no');
  var hint = document.getElementById('hint');
  var tries = 0;
  var MAX = 5;
  var labels = ['Are you sure?', 'Try again', 'Nice try', 'Not that one', 'Last chance'];
  var hints = [
    'Interesting choice.',
    'That button is shy.',
    'It really does not want to be pressed.',
    'Tonight is a no-free zone.',
    'Okay, okay. One honest option coming up.'
  ];
  var honest = false;
  var lastMove = 0;

  function dodge(e) {
    if (honest) return;
    if (e) { e.preventDefault(); e.stopPropagation(); }
    var now = Date.now();
    if (now - lastMove < 250) return; // one touch fires several events; count it once
    lastMove = now;

    tries++;
    if (tries >= MAX + 1) { makeHonest(); return; }

    no.textContent = labels[tries - 1];
    hint.textContent = hints[tries - 1];
    growYes(tries);

    // jump somewhere on screen, away from the finger and the Yes button
    var r = no.getBoundingClientRect();
    if (!no.classList.contains('loose')) {
      no.style.left = r.left + 'px';
      no.style.top = r.top + 'px';
      no.classList.add('loose');
      void no.offsetWidth;
    }
    var w = r.width + 40, h = r.height;
    var vw = window.innerWidth, vh = window.innerHeight;
    var pad = 16;
    var yr = yes.getBoundingClientRect();
    var x, y, ok = false, n = 0;
    while (!ok && n < 40) {
      n++;
      x = pad + Math.random() * Math.max(0, vw - w - pad * 2);
      y = 70 + Math.random() * Math.max(0, vh - h - 140);
      var farFromSelf = Math.abs(x - r.left) + Math.abs(y - r.top) > 120;
      var clearOfYes = x + w < yr.left - 10 || x > yr.right + 10 || y + h < yr.top - 10 || y > yr.bottom + 10;
      ok = farFromSelf && clearOfYes;
    }
    no.style.left = Math.round(x) + 'px';
    no.style.top = Math.round(y) + 'px';
  }

  function makeHonest() {
    honest = true;
    no.classList.remove('loose', 'btn-ghost');
    no.style.left = no.style.top = '';
    no.classList.add('honest');
    no.textContent = 'Not tonight. Rain check?';
    hint.textContent = 'That one is real. No hard feelings either way.';
    growYes(MAX);
  }

  function growYes(n) {
    yes.style.fontSize = (17 + n * 2) + 'px';
    yes.style.minHeight = (54 + n * 4) + 'px';
    yes.style.padding = '0 ' + (28 + n * 3) + 'px';
  }

  ['pointerdown', 'touchstart', 'mouseenter'].forEach(function (ev) {
    no.addEventListener(ev, function (e) {
      if (ev === 'mouseenter' && e.pointerType === 'touch') return;
      dodge(ev === 'mouseenter' ? null : e);
    }, { passive: false });
  });
  no.addEventListener('click', function (e) {
    if (!honest) { dodge(e); return; } // keyboard users hit click directly
    show('s-rain');
  });

  yes.addEventListener('click', function () {
    show('s-yes');
    no.classList.remove('loose');
    confetti();
  });
  document.getElementById('changed').addEventListener('click', function () {
    show('s-yes');
    confetti();
  });

  // confetti, hand-rolled
  var cv = document.getElementById('confetti');
  var ctx = cv.getContext('2d');
  function confetti() {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var W = window.innerWidth, H = window.innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var colors = ['#e0452b', '#161513', '#e0452b', '#c9bfae', '#f2a65a'];
    var parts = [];
    for (var i = 0; i < 110; i++) {
      var side = i % 2 ? 1 : -1;
      parts.push({
        x: side > 0 ? W * 0.15 : W * 0.85,
        y: H * 0.62,
        vx: (Math.random() * 6 + 2) * (side > 0 ? 1 : -1) * (Math.random() < .3 ? -.4 : 1),
        vy: -(Math.random() * 11 + 8),
        w: Math.random() * 6 + 5, h: Math.random() * 4 + 3,
        r: Math.random() * Math.PI, vr: (Math.random() - .5) * .3,
        c: colors[i % colors.length]
      });
    }
    var start = performance.now();
    function frame(t) {
      var el = t - start;
      ctx.clearRect(0, 0, W, H);
      var alive = false;
      parts.forEach(function (p) {
        p.vy += 0.32; p.vx *= 0.985; p.vy *= 0.985;
        p.x += p.vx; p.y += p.vy; p.r += p.vr;
        if (p.y < H + 20) alive = true;
        ctx.save();
        ctx.globalAlpha = Math.max(0, 1 - Math.max(0, el - 2200) / 800);
        ctx.translate(p.x, p.y); ctx.rotate(p.r);
        ctx.fillStyle = p.c;
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.r * 2)) + 1);
        ctx.restore();
      });
      if (alive && el < 3000) requestAnimationFrame(frame);
      else ctx.clearRect(0, 0, W, H);
    }
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
